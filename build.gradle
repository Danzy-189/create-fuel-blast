plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
        data {
            args '--mod', mod_id, '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.tterrag.com/' }          // Create, Registrate, Flywheel
    maven { url = 'https://maven.blamejared.com' }        // JEI
    maven { url = 'https://www.cursemaven.com'            // optional addon deps
        content { includeGroup "curse.maven" } }
    maven { url = 'https://api.modrinth.com/maven'
        content { includeGroup "maven.modrinth" } }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create + its libraries
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation fg.deobf("com.jozufozu.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")

    // Optional addons: the mod only uses the Forge fluid capability, so these are
    // needed for testing in the dev environment, not for compilation.
    // runtimeOnly fg.deobf("maven.modrinth:create-diesel-generators:<version>")
    // runtimeOnly fg.deobf("maven.modrinth:tfmg:<version>")
    // runtimeOnly fg.deobf("maven.modrinth:create-connected:<version>")
    // runtimeOnly fg.deobf("maven.modrinth:create-aeronautics:<version>")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest { attributes(["Specification-Title": mod_id, "Implementation-Version": project.jar.archiveVersion]) }
    finalizedBy 'reobfJar'
}
