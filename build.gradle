plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft
    }

    runs {
        client { client() }
        server { server() }
        configureEach { systemProperty 'forge.logging.console.level', 'debug' }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }        // Create 6
    maven { url = 'https://maven.tterrag.com/' }         // Registrate
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven'
        content { includeGroup "maven.modrinth" } }
    maven { url = 'https://www.cursemaven.com'
        content { includeGroup "curse.maven" } }
    mavenCentral()
}

dependencies {
    // The addon itself only needs NeoForge: every Create / Aeronautics / Valkyrien Skies
    // touchpoint is soft (capabilities + reflection). These are dev-runtime conveniences.
    // implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"
    // implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    // implementation "dev.engine_room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    var props = [
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors,
        minecraft_version: minecraft_version, neo_version: neo_version
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}
