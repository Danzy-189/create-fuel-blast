modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Danzy-189/create-fuel-blast/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Addon for Create Aeronautics. Fluid tanks and vessels that store flammable fuel
(Create: Diesel Generators, The Factory Must Grow, and any fluid tagged as fuel)
cook off when an explosion happens next to them - TNT, creepers, addon bombs or
modded weapons. Works for tanks in the world, tanks mounted on assembled
contraptions, airship interiors and Valkyrien Skies physics ships. The more fuel
inside, the bigger the fireball, and neighbouring tanks chain-react.
'''

